[package]
name = "velora"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
velora-protocol.workspace = true
velora-client-core = { workspace = true, features = ["decode"] }
velora-update.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
clap.workspace = true
winit = "0.30"
softbuffer = "0.4"
# The session window draws with OpenGL (the same versions eframe brings in), in software
# when that fails.
glutin = "0.32"
glow = "0.17"
raw-window-handle = "0.6"
serde.workspace = true
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sys-locale = "0.3"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
