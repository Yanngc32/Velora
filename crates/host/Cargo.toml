[package]
name = "sm-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
sm-protocol.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
quinn.workspace = true
clap.workspace = true
openh264.workspace = true
ffmpeg-sys-next = { version = "9", default-features = false, features = ["avcodec"], optional = true }

[features]
# Hardware encoders (NVENC, Quick Sync, AMF, VA-API) through the system FFmpeg libraries.
ffmpeg = ["dep:ffmpeg-sys-next"]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shm", "damage"] }
libc = "0.2"
evdev = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
] }
