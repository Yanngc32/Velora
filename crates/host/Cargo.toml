[package]
name = "velora-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
velora-protocol.workspace = true
velora-update.workspace = true
velora-clipboard.workspace = true
velora-audio.workspace = true
# Standalone reach (docs/nat-traversal.md): router mappings and addresses, the DHT record, relaying.
velora-nat.workspace = true
velora-dht.workspace = true
velora-relay.workspace = true
# This computer's addresses on a VPN mesh (Tailscale, Netbird), to announce them.
if-addrs = "0.13"
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
ring.workspace = true
base64.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "signal"] }
quinn.workspace = true
# The dual-stack socket (IPV6_V6ONLY off); the version quinn and tokio already use.
socket2 = "0.6"
clap.workspace = true
openh264.workspace = true
qrcode = { version = "0.14", default-features = false }
rpassword = "7"
ffmpeg-sys-next = { version = "9", default-features = false, features = ["avcodec"], optional = true }

[dev-dependencies]
# test-util: the timing tests of the DHT record publisher run on a paused clock.
tokio = { workspace = true, features = ["test-util"] }

[features]
# Hardware encoders (NVENC, Quick Sync, AMF, VA-API) through the system FFmpeg libraries.
ffmpeg = ["dep:ffmpeg-sys-next", "velora-audio/ffmpeg"]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shm", "damage"] }
libc = "0.2"
evdev = "0.13"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
] }
