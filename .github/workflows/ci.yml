name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  ffmpeg:
    # Hardware encoder and decoder backends, built against the distro's FFmpeg.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libavcodec-dev libavutil-dev pkg-config clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # ffmpeg-sys-next generates its bindings from the system headers and does not notice when
      # they change, so the cache is keyed on the FFmpeg version: cached 6.1 bindings linked
      # against 8.0 crashed the tests when ubuntu-latest moved to 26.04.
      - id: ffmpeg
        run: echo "version=$(dpkg-query -W -f='${Version}' libavcodec-dev | tr ':' '-')" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffmpeg-${{ steps.ffmpeg.outputs.version }}
      - run: cargo clippy -p velora-host -p velora --all-targets --features velora-host/ffmpeg,velora/ffmpeg -- -D warnings
      - run: cargo test -p velora-host -p velora-client-core --features velora-host/ffmpeg,velora-client-core/ffmpeg

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      # uniffi-bindgen is a build tool (not shipped) and follows its own MSRV.
      - run: cargo check --workspace --exclude uniffi-bindgen --all-targets
