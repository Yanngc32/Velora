name: Release

# A push to main whose workspace version has no `v<version>` tag yet builds and publishes that
# release (creating the tag); installed copies update to it. A pushed `v*` tag does the same.
# Pull requests touching the release machinery run the same builds as a dry run.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - crates/update/**
      - crates/release/**
      - packaging/**
  workflow_dispatch:

permissions:
  contents: read

# One release at a time per ref, so a second push waits and then sees the first one's tag.
concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  # LGPL shared FFmpeg builds; see packaging/NOTICE.txt.
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether to publish
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          publish=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF" in
              refs/tags/*)
                [ "$tag" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
                publish=true ;;
              refs/heads/main)
                # Exit code 2 means the tag does not exist; anything else is an error.
                rc=0
                git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || rc=$?
                case $rc in
                  0) echo "$tag already exists, nothing to release" ;;
                  2) publish=true ;;
                  *) exit "$rc" ;;
                esac ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # On main, build only when there is a release to publish; otherwise it is a dry run.
    if: needs.version.outputs.publish == 'true' || github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu runner, for a low glibc requirement.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ffmpeg: ffmpeg-n8.1-latest-linux64-lgpl-shared-8.1
            archive: tar.xz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ffmpeg: ffmpeg-n8.1-latest-win64-lgpl-shared-8.1
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install bindgen dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev

      - name: Fetch FFmpeg
        run: |
          curl -sSLf -o "ffmpeg.${{ matrix.archive }}" "$FFMPEG_URL/${{ matrix.ffmpeg }}.${{ matrix.archive }}"
          # Git Bash's tar cannot read zip files on Windows.
          if [ "${{ matrix.archive }}" = zip ]; then 7z x -y ffmpeg.zip > /dev/null; else tar -xf ffmpeg.tar.xz; fi
          echo "FFMPEG_DIR=$PWD/${{ matrix.ffmpeg }}" >> "$GITHUB_ENV"

      - name: Build
        env:
          VELORA_RELEASE_BUILD: "1"
          # Linux: find the bundled FFmpeg in ./lib next to the binaries. DT_RPATH (not RUNPATH)
          # also applies to the libraries' own dependencies (libavcodec -> libswresample).
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-Wl,--disable-new-dtags,-rpath,$ORIGIN/lib' || '' }}
        run: cargo build --release --locked -p velora-host -p velora --features velora-host/ffmpeg

      - name: Stage install directory
        run: |
          mkdir -p stage
          cp LICENSE packaging/NOTICE.txt stage/
          cp "$FFMPEG_DIR/LICENSE.txt" stage/FFMPEG-LICENSE.txt
          # Fonts and icons embedded in the desktop launcher.
          mkdir -p stage/licenses
          cp crates/client/assets/fonts/OFL-*.txt crates/client/assets/icons/LICENSE-lucide.txt stage/licenses/
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/velora-host.exe target/release/velora.exe stage/
            for lib in avcodec avutil swresample; do cp "$FFMPEG_DIR"/bin/$lib-*.dll stage/; done
          else
            cp target/release/velora-host target/release/velora stage/
            mkdir -p stage/lib
            # Copy each library once, under its SONAME (e.g. libavcodec.so.62).
            for f in "$FFMPEG_DIR"/lib/lib{avcodec,avutil,swresample}.so.*; do
              name=$(basename "$f")
              [[ $name =~ ^lib[a-z]+\.so\.[0-9]+$ ]] && cp -L "$f" "stage/lib/$name"
            done
            chmod 644 stage/lib/* stage/licenses/* stage/LICENSE stage/NOTICE.txt stage/FFMPEG-LICENSE.txt
          fi
          ls -lR stage

      - name: Smoke test (binaries start with the bundled libraries)
        run: |
          ./stage/velora-host --version
          ./stage/velora --version

      - name: Package
        run: cargo run --release --locked -p velora-release -- package --target ${{ matrix.target }} --root stage --dist dist

      # PowerShell: Git Bash would rewrite ISCC's /D and /O options as paths.
      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          & $iscc "/DAppVersion=$version" "/DStage=$PWD\stage" "/O$PWD\dist" packaging\velora.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist\*-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Manifest
        run: |
          cargo run --release --locked -p velora-release -- manifest --dist dist
          cat dist/manifest.json
          ls -l dist

      # Draft first so installed copies never see a manifest before all its files exist.
      # Publishing the draft creates the tag on this commit if it does not exist yet.
      - name: Publish release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes dist/*
          gh release edit "$TAG" --draft=false --latest
